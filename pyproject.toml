[project]
name = "bedroom"
version = "0.1.0"
description = "A small pixel-art bedroom that reflects whatever music Windows is already playing."
requires-python = ">=3.14,<3.15"
dependencies = [
    "winrt-runtime>=3.2.1",
    "winrt-Windows.Foundation>=3.2.1",
    "winrt-Windows.Foundation.Collections>=3.2.1",
    "winrt-Windows.Media.Control>=3.2.1",
    "winrt-Windows.Storage.Streams>=3.2.1",
]

[project.scripts]
bedroom = "bedroom.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Authoring only. The app itself loads the finished PNGs through Qt and
    # never imports Pillow.
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedroom"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
