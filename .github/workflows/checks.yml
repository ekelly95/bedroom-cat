name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Windows only, and not as a preference: the app reads Windows' own
    # now-playing service, and the winrt wheels it depends on are built for
    # nothing else. A Linux runner could not install the project, let alone
    # test it.
    runs-on: windows-latest

    steps:
      # Pinned to exact releases rather than a moving major tag. setup-uv stopped
      # publishing one at v7 while its releases went on to v10, so `@v10` does not
      # resolve and `@v7` would be three majors behind. Both of these run on
      # node24; the first version of this workflow used tags still on node20.
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Two steps rather than one chained command, so a failure names itself in
      # the summary instead of both hiding behind a single red cross. Neither is
      # piped anywhere: piping the test run to something else has masked a
      # failure in this project before.
      - name: tests
        run: uv run pytest

      - name: ruff
        run: uv run ruff check .
